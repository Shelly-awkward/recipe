<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="食譜">
<meta name="format-detection" content="telephone=no">
<title>我的食譜</title>
<style>
:root{
  --bg:#F6F4EF;
  --card:#FFFFFF;
  --ink:#1E2430;
  --ink-soft:#5A6478;
  --line:#E2DED5;
  --accent:#D97706;
  --accent-ink:#7C3E00;
  --night:#14213D;
  --warn-bg:#FFF4E5;
  --warn-line:#F59E0B;
  --warn-ink:#7C3E00;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:18px;
  line-height:1.7;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  background:var(--night);
  color:#fff;
  padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
  position:sticky;top:0;z-index:10;
}
.head-inner{
  max-width:640px;margin:0 auto;
  display:flex;align-items:center;gap:12px;min-height:44px;
}
header h1{font-size:1.25rem;font-weight:800;letter-spacing:.04em;flex:1;}
.back{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:0 12px;
  color:#fff;text-decoration:none;font-size:1rem;font-weight:700;
  border:1px solid rgba(255,255,255,.35);border-radius:999px;
}
.back:active{background:rgba(255,255,255,.15);}
.back[hidden]{display:none;}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px;}

/* 首頁列表 */
.list{list-style:none;display:flex;flex-direction:column;gap:12px;}
.list a{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;min-height:64px;
  text-decoration:none;color:inherit;font-size:1.15rem;font-weight:700;
}
.list a:active{background:#F1EDE4;}
.list a::after{content:"›";color:var(--ink-soft);font-size:1.6rem;font-weight:400;}
.empty{color:var(--ink-soft);padding:30px 4px;}

/* 食譜頁 */
.title{font-size:1.7rem;font-weight:900;line-height:1.3;margin-bottom:16px;}
.servings{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 12px 12px 20px;margin-bottom:24px;
}
.servings .label{font-weight:700;color:var(--ink-soft);}
.stepper{display:flex;align-items:center;gap:4px;}
.stepper button{
  width:56px;height:56px;border-radius:12px;
  border:1px solid var(--line);background:#F1EDE4;color:var(--ink);
  font:inherit;font-size:1.8rem;font-weight:700;line-height:1;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.stepper button:active{background:#E2DED5;}
.stepper button:disabled{opacity:.35;cursor:default;}
.stepper .num{
  min-width:64px;text-align:center;
  font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums;
}
.stepper .unit{font-size:1rem;color:var(--ink-soft);margin-right:8px;}

section{margin-bottom:28px;}
h2{
  font-size:1.05rem;font-weight:800;color:var(--accent-ink);
  letter-spacing:.08em;margin-bottom:10px;
}
.ingredients{
  list-style:none;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.ingredients li{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:14px 20px;border-top:1px solid var(--line);
}
.ingredients li:first-child{border-top:0;}
.ingredients .amt{
  white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--accent-ink);
}
.ingredients .fixed .amt{color:var(--ink-soft);font-weight:600;}
.ingredients .fixed .amt::after{content:" ・固定";font-size:.8rem;font-weight:400;}

.warning{
  background:var(--warn-bg);border:2px solid var(--warn-line);border-left-width:8px;
  border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;
  color:var(--warn-ink);font-weight:700;
}
.warning::before{content:"注意：";}
.steps{
  list-style:none;counter-reset:step;
  display:flex;flex-direction:column;gap:12px;
}
.steps li{
  counter-increment:step;
  display:flex;gap:14px;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;
}
.steps li::before{
  content:counter(step);
  flex:0 0 36px;height:36px;border-radius:50%;
  background:var(--night);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1rem;
}
.notes{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:14px 18px;color:var(--ink-soft);
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <a class="back" id="back" href="#/" hidden>‹ 返回</a>
    <h1 id="head-title">我的食譜</h1>
  </div>
</header>
<main id="app"></main>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
